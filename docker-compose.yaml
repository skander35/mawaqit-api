services:
  mawaqit-api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    env_file:
      - .env
    environment:
      - TIMEZONE=Europe/Paris
    volumes:
      - mawaqit-cache:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/v1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mawaqit-cache:
